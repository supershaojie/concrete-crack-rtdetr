# Lightweight RT-DETR-ResNet18 with structure-guided cross-scale content residual (CSCEF-v5.2 minimal compatibility).
# Model docs: https://docs.ultralytics.com/models/rtdetr
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=rtdetr-resnet18-lite-cscef-v52-scca-compat.yaml' will call scale 'l'
  # [depth, width, max_channels]
  l: [1.00, 1.00, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, ConvNormLayer, [32, 3, 2, None, False, "relu"]] # 0-P1/2
  - [-1, 1, ConvNormLayer, [32, 3, 1, None, False, "relu"]] # 1
  - [-1, 1, ConvNormLayer, [64, 3, 1, None, False, "relu"]] # 2
  - [-1, 1, nn.MaxPool2d, [3, 2, 1]] # 3-P2/4

  # [ch_out, block_type, block_nums, stage_num, act]
  - [-1, 1, Blocks, [64, BasicBlock, 2, 2, "relu"]] # 4
  - [-1, 1, Blocks, [128, BasicBlock, 2, 3, "relu"]] # 5-P3/8
  - [-1, 1, Blocks, [256, BasicBlock, 2, 4, "relu"]] # 6-P4/16
  - [-1, 1, Blocks, [512, BasicBlock, 2, 5, "relu"]] # 7-P5/32

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 8 input_proj.2
  - [-1, 1, SCCAAIFI, [1024, 8]] # 9
  - [-1, 1, Conv, [256, 1, 1]] # 10, Y5, lateral_convs.0

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [6, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 12 input_proj.1
  - [[-2, -1], 1, Concat, [1]] # 13
  - [-1, 3, RepC3, [256, 0.5]] # 14, fpn_blocks.0
  - [-1, 1, Conv, [256, 1, 1]] # 15, Y4, lateral_convs.1

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 16 upsampled P4 semantic feature
  - [5, 1, Conv, [256, 1, 1, None, 1, 1, False]] # 17 projected backbone S3/8 lateral feature
  - [[17, 16], 1, CSCEFv52Compat, []] # 18 structure-guided content residual; zero output projection
  - [[16, 18], 1, Concat, [1]] # 19 preserve original concat: upsampled P4 + enhanced S3
  - [-1, 3, RepC3, [256, 0.5]] # 20, fpn_blocks.1

  - [-1, 1, Conv, [256, 3, 2]] # 21, downsample_convs.0
  - [[-1, 15], 1, Concat, [1]] # 22 cat Y4
  - [-1, 3, RepC3, [256, 0.5]] # 23, pan_blocks.0

  - [-1, 1, Conv, [256, 3, 2]] # 24, downsample_convs.1
  - [[-1, 10], 1, Concat, [1]] # 25 cat Y5
  - [-1, 3, RepC3, [256, 0.5]] # 26, pan_blocks.1

  - [[20, 23, 26], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]] # RTDETRDecoder(P3, P4, P5)
