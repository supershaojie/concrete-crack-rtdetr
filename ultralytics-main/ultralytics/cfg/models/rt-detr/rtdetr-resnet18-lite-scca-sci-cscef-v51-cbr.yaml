# SCI only calibrates the existing upsampled Y4 semantic side branch.
nc: 80
scales:
  l: [1.00, 1.00, 1024]

backbone:
  - [-1, 1, ConvNormLayer, [32, 3, 2, None, false, relu]] # 0
  - [-1, 1, ConvNormLayer, [32, 3, 1, None, false, relu]] # 1
  - [-1, 1, ConvNormLayer, [64, 3, 1, None, false, relu]] # 2
  - [-1, 1, nn.MaxPool2d, [3, 2, 1]] # 3
  - [-1, 1, Blocks, [64, BasicBlock, 2, 2, relu]] # 4
  - [-1, 1, Blocks, [128, BasicBlock, 2, 3, relu]] # 5
  - [-1, 1, Blocks, [256, BasicBlock, 2, 4, relu]] # 6
  - [-1, 1, Blocks, [512, BasicBlock, 2, 5, relu]] # 7

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, false]] # 8
  - [-1, 1, SCCAAIFI, [1024, 8]] # 9 original AIFI / SCCAAIFI
  - [-1, 1, Conv, [256, 1, 1]] # 10
  - [-1, 1, nn.Upsample, [None, 2, nearest]] # 11
  - [6, 1, Conv, [256, 1, 1, None, 1, 1, false]] # 12
  - [[-2, -1], 1, Concat, [1]] # 13
  - [-1, 3, RepC3, [256, 0.5]] # 14
  - [-1, 1, Conv, [256, 1, 1]] # 15 Y4; original main path
  - [-1, 1, nn.Upsample, [None, 2, nearest]] # 16 original nearest-upsampled Y4
  - [5, 1, Conv, [256, 1, 1, None, 1, 1, false]] # 17 original projected P3 lateral
  - [16, 1, SCIAdapter, [32]] # 18 semantic proxy ONLY; identity + detached-input residual
  - [[17, 18], 1, CSCEFv51, []] # 19 original CSCEF-v5.1 at original insertion
  - [[16, 19], 1, Concat, [1]] # 20 original semantic tensor + enhanced lateral
  - [-1, 3, RepC3, [256, 0.5]] # 21 P3
  - [-1, 1, Conv, [256, 3, 2]] # 22
  - [[-1, 15], 1, Concat, [1]] # 23
  - [-1, 3, RepC3, [256, 0.5]] # 24 P4
  - [-1, 1, Conv, [256, 3, 2]] # 25
  - [[-1, 10], 1, Concat, [1]] # 26
  - [-1, 3, RepC3, [256, 0.5]] # 27 P5
  - [[21, 24, 27], 1, RTDETRDecoderCBR, [nc, 256, 300, 4, 8, 3]] # 28 original decoder; original final P3 for CBR
