# Project starting recipe. It is distinct from the locked author's COCO recipe.
model: dfine_m
initialization: coco_detection_pretrained
num_classes: 1
epochs: 200
early_stopping: false
batch_size: 16
eval_batch_size: 16
train_workers: 8
eval_workers: 0
imgsz: 640
seed: 42
device: "cuda:0"
amp: true
# Explicit startup scale; native GradScaler growth/backoff semantics are retained.
amp_init_scale: 1.0
amp_growth_factor: 2.0
amp_backoff_factor: 0.5
amp_growth_interval: 2000
deterministic: true
cache_images: false
multi_scale: false
optimizer: AdamW
lr0: 0.0001
backbone_lr: 0.00001
betas: [0.9, 0.999]
weight_decay: 0.0001
gradient_accumulation_steps: 1
gradient_clip_max_norm: 0.1
warmup_epochs: 5
warmup_start_factor: 0.001
lr_schedule: warmup_then_cosine
lrf: 0.01
ema: true
ema_decay: 0.9999
ema_warmup_updates: 1000
ema_stage_restart: false
eval_conf: 0.001
eval_max_det: 300
eval_nms: false
hsv_h: 0.04901
hsv_s: 0.98
hsv_v: 0.78
degrees: 23.66
translate: 0.338
scale: 0.95
shear: 7.605
perspective: 0.001
flipud: 0.0845
fliplr: 0.65
mosaic: 1.0
mixup: 0.3042
cutmix: 0.0845
copy_paste: 0.0
bgr: 0.0
close_mosaic: 5
drop_last: true
print_freq: 20
preflight_steps: 2
data_yaml: /root/autodl-tmp/projects/Crack_RTDETR/configs/crack_autodl.yaml
data_root: null
public_coco: null
reuse_manifest: null
source: null
weights: null
run_root: null
enforce_counts: true
