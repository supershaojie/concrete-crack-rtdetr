model: fasterrcnn_resnet50_fpn
num_classes: 2
weights: null
weights_backbone: null
trainable_backbone_layers: 5
input_height: 640
input_width: 640
epochs: 200
patience: 50
batch_size: 16
eval_batch_size: 16
train_workers: 8
eval_workers: 0
device: cuda:0
seed: 42
amp: true
amp_init_scale: 128.0
# No scale growth within the 75,600-step budget; nonfinite gradients fail, never skip.
amp_growth_interval: 1000000000
deterministic: true
resume: false
optimizer: SGD
lr0: 0.02
momentum: 0.9
weight_decay: 0.0001
nesterov: false
gradient_accumulation_steps: 1
ema: false
warmup_epochs: 5
warmup_start_factor: 0.001
lr_schedule: warmup_then_cosine
lrf: 0.01
gradient_clip: null
model_transform_min_size: 640
model_transform_max_size: 640
box_score_thresh: 0.001
box_nms_thresh: 0.7
box_detections_per_img: 300
rpn_nms_thresh: 0.7
rpn_pre_nms_top_n_train: 2000
rpn_post_nms_top_n_train: 2000
rpn_pre_nms_top_n_test: 1000
rpn_post_nms_top_n_test: 1000
hsv_h: 0.015
hsv_s: 0.5
hsv_v: 0.35
degrees: 5.0
translate: 0.1
scale: 0.4
shear: 1.5
perspective: 0.0002
flipud: 0.2
fliplr: 0.5
mosaic: 0.8
mixup: 0.05
close_mosaic: 10
copy_paste: 0.0
cutmix: 0.0
erasing: 0.0
bgr: 0.0
auto_augment: null
