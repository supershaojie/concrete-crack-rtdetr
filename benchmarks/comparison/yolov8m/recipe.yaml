# Frozen before seeing any YOLOv8m result. Remaining defaults: official v8.3.20.
task: detect
model: yolov8m.yaml
imgsz: 640
epochs: 200
patience: 50
batch: 16
workers: 8
device: 0
seed: 42
nbs: 64
amp: true
deterministic: true
cache: false
rect: false
multi_scale: false
freeze: null
resume: false
fraction: 1.0
val: true
optimizer: SGD
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
cos_lr: true
warmup_epochs: 5.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1
hsv_h: 0.015
hsv_s: 0.5
hsv_v: 0.35
degrees: 5.0
translate: 0.1
scale: 0.4
shear: 1.5
perspective: 0.0002
flipud: 0.2
fliplr: 0.5
mosaic: 0.8
mixup: 0.05
close_mosaic: 10
copy_paste: 0.0
erasing: 0.0
bgr: 0.0
auto_augment: null
# cutmix is absent in v8.3.20: do not pass it to get_cfg.
save: true
save_period: -1
plots: true
pretrained: false
single_cls: false
classes: null
# Native training validation; final export uses a separate FP32 entry point.
conf: 0.001
iou: 0.7
max_det: 300
agnostic_nms: false
augment: false
